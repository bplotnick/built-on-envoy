name: resolver
parent: dns-gateway
categories:
  - Network
  - Security
author: Palantir Technologies
featured: true
description: Intercept DNS queries and allocate virtual IPs per domain
longDescription: |
  The UDP listener half of the [dns-gateway](dns-gateway) extension set. It intercepts DNS
  queries for configured domain patterns, allocates a virtual IP from each domain's dedicated
  CIDR range, and responds with an A record (IPv4 `base_ip`) or AAAA record (IPv6 `base_ip`).
  The application receives this virtual IP and
  connects to it as if it were the real destination. Non-matching queries pass through to
  upstream resolvers.

  Each allocated virtual IP, its domain, and per-domain metadata are written to a process-wide
  cache that the companion [lookup](lookup) network filter reads on the
  subsequent TCP connection. Both filters ship in the same `dns-gateway` dynamic module, so the
  cache is shared in-process.

  A matcher gives its range(s) in one of two mutually exclusive forms: the flat single-family form
  (`base_ip` + `prefix_len`, family inferred from `base_ip`) or the explicit form (`ipv4` and/or
  `ipv6` blocks). Set both `ipv4` and `ipv6` to serve a domain dual-stack (A from `ipv4`, AAAA from
  `ipv6`) under one matcher with shared metadata. Matcher precedence is first-match by config
  order; if the winning matcher doesn't serve the queried family the resolver returns NODATA (never
  pass-through).

  > Backward compatibility: this filter is also reachable under the legacy name
  > `dns-gateway` via `--extension dns-gateway --filter-type udp_listener`.

  ## Configuration

  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | `domains` | array | yes | List of domain patterns to intercept |
  | `domains[].domain` | string | yes | Exact (`example.com`), single-level wildcard (`*.aws.com`), or `*` catch-all |
  | `domains[].base_ip` | string | one form | Flat form: base address (IPv4 → A, IPv6 → AAAA). Mutually exclusive with `ipv4`/`ipv6` |
  | `domains[].prefix_len` | integer | one form | Flat form: CIDR prefix length (IPv4: 1–32, IPv6: 1–128) |
  | `domains[].ipv4` | object | one form | Explicit form: IPv4 range (answers A). Combine with `ipv6` for dual-stack. Mutually exclusive with flat `base_ip`/`prefix_len` |
  | `domains[].ipv4.base_ip` | string | with `ipv4` | IPv4 base address of the range (e.g. `10.0.0.0`) |
  | `domains[].ipv4.prefix_len` | integer | with `ipv4` | CIDR prefix length (1–32) |
  | `domains[].ipv6` | object | one form | Explicit form: IPv6 range (answers AAAA). Combine with `ipv4` for dual-stack. Mutually exclusive with flat `base_ip`/`prefix_len` |
  | `domains[].ipv6.base_ip` | string | with `ipv6` | IPv6 base address of the range (e.g. `fd00::`) |
  | `domains[].ipv6.prefix_len` | integer | with `ipv6` | CIDR prefix length (1–128) |
  | `domains[].metadata` | object | no | String key-value pairs propagated to filter state (shared across families) |
  | `fail_open` | boolean | no | If `true`, forward queries upstream when a CIDR range is exhausted. Default: `false` (return NODATA) |

  ## Prerequisites

  Requires iptables/nftables rules to redirect DNS (UDP port 53) to Envoy's DNS listener.
tags:
  - access-control
  - dns
  - egress
  - networking
  - routing
  - rust
